<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LyricsApp — демо</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    display: grid; place-items: center; min-height: 100vh;
    padding: 36px 20px;
    background:
      radial-gradient(1200px 700px at 50% -10%, #1b2740 0%, #0b0e16 55%, #06070b 100%);
    color: #e8eefc;
    font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  .wrap { width: min(1080px, 100%); }
  h1 {
    margin: 0 0 6px;
    font-size: clamp(22px, 3vw, 34px);
    font-weight: 600;
    letter-spacing: .04em;
  }
  p.sub { margin: 0 0 20px; color: #8fa3c8; font-size: 15px; }
  .frame {
    position: relative;
    border-radius: 18px;
    overflow: hidden;
    background: #000;
    border: 1px solid rgba(150, 180, 255, .18);
    box-shadow: 0 30px 80px rgba(0, 0, 0, .55);
  }
  video {
    display: block;
    width: 100%;
    height: auto;
    aspect-ratio: 16 / 9;
    background: #000;
  }
  .hint { margin-top: 14px; color: #7d8fb2; font-size: 13px; }
  a { color: #9cc0ff; }
</style>
</head>
<body>
<main class="wrap">
  <h1>LyricsApp</h1>
  <p class="sub">Демо интерфейса · CUPSIZE — ты любишь танцевать</p>
  <div class="frame">
    <video src="LyricsApp-demo-v2.mp4" poster="poster.png"
           controls autoplay muted loop playsinline preload="metadata"></video>
  </div>
  <p class="hint">Если автозапуск не сработал — нажмите ▶. Звук включается кнопкой динамика.</p>
</main>
</body>
</html>
